name: Bambu Lab
description: >-
  Bambu Lab is a consumer 3D-printing company (X-series, P-series, and A-series
  printers, the AMS multi-material system, and the MakerWorld model platform)
  that connects its printers to the Bambu Handy app and Bambu Studio slicer over
  a cloud and LAN control plane. There is no open, self-service public REST API:
  machine control runs over an MQTT interface (us/cn.mqtt.bambulab.com:8883, TLS,
  authenticated with a Bambu account user id and MQTT token), and a firmware-level
  "printer control authorization" mechanism now gates binding, firmware updates,
  camera streams, and print/movement commands. Third parties integrate through
  Bambu Connect, LAN Developer Mode, or by applying for SDK access; the practical
  API surface today is community-reverse-engineered (OpenBambuAPI, Bambu-Lab-Cloud-API,
  and Python/Rust client libraries). Added to the API Evangelist network from the
  IDG Capital portfolio and enriched from public sources.
